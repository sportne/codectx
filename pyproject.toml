[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codectx"
version = "1.0.0"
description = "Local code graph and context bundle generator for manual LLM use."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "codectx contributors" }]
dependencies = [
  "pathspec>=0.12,<1",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-java>=0.23,<0.24",
  "tree-sitter-cpp>=0.23,<0.24",
  "tree-sitter-python>=0.23,<0.24",
  "tree-sitter-matlab>=1.3,<1.4",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.10,<2",
  "pex>=2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "vulture>=2.16,<3",
]
pretty = [
  "rich",
]

[project.scripts]
codectx = "codectx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codectx"]

[tool.ruff]
line-length = 88
target-version = "py311"
respect-gitignore = true
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "C90", "D", "E", "F", "I", "N", "S", "SIM", "UP", "W"]
ignore = ["D105", "D107", "D203", "D211", "D213", "E501", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
packages = ["codectx"]
strict = true
warn_unused_configs = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.vulture]
paths = ["src", "vulture_whitelist.py"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
xfail_strict = true

[tool.coverage.run]
source = ["codectx"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
