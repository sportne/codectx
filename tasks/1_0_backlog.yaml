task_schema:
  status:
    description: Current implementation state for the task.
    values: [todo, in_progress, blocked, done]
    default: todo
  priority:
    description: Release-readiness priority before declaring 1.0.0.
    values: [P0, P1, P2, P3]
  type:
    description: Whether the task can be completed by an AFK agent or needs human input.
    values: [AFK, HITL]
milestones:
  - id: V1
    name: 1.0 readiness
    tasks:
      - id: V1-001
        title: Define 1.0 release criteria and stable contracts
        status: done
        priority: P0
        type: HITL
        blocked_by: []
        rationale: >
          A 1.0.0 release needs explicit stability promises for the CLI, output
          formats, schema behavior, release artifacts, and compatibility support.
        work:
          - Decide which CLI commands and flags are stable for 1.0.
          - Decide which JSON context bundle fields are stable for downstream tools.
          - Decide the SQLite schema compatibility and migration promise.
          - Decide the supported Python and platform compatibility promise.
          - Record release artifact guarantees for wheels, source distributions, and PEX.
        acceptance:
          - Documents which CLI commands, JSON fields, schema behavior, release artifacts, and compatibility promises are stable for 1.0.

      - id: V1-002
        title: Build real-repo context quality evaluation harness
        status: done
        priority: P0
        type: AFK
        blocked_by: [V1-001]
        rationale: >
          Fixture tests prove mechanics, but 1.0 readiness depends on repeatable
          evidence that generated context bundles are useful on representative
          real Java and C++ repositories.
        work:
          - Define representative Java and C++ evaluation targets.
          - Record expected useful context for each target and goal.
          - Add a repeatable command or script for generating evaluation bundles.
          - Record quality scores and review notes in project documentation.
        acceptance:
          - Adds a repeatable real-repo evaluation process with representative Java and C++ targets, expected useful context, and recorded quality scores.

      - id: V1-003
        title: Add configurable include/exclude and ignore-file semantics
        status: todo
        priority: P0
        type: AFK
        blocked_by: [V1-002]
        rationale: >
          Fixed built-in ignore directories are not enough for messy real
          repositories, and vendored or generated files can dominate diagnostics
          and context rankings.
        work:
          - Design user-facing include and exclude controls for indexing.
          - Define how .gitignore, .ignore, and project-specific ignore files are respected.
          - Support explicitly including files that would otherwise be ignored.
          - Cover subdirectory invocation and nested ignore-file behavior.
        acceptance:
          - Supports user-controlled include/exclude behavior, respects common ignore files where intended, and covers subdirectory invocation and force-include style cases.

      - id: V1-004
        title: Improve token budgeting for large enclosing scopes
        status: todo
        priority: P0
        type: AFK
        blocked_by: [V1-002]
        rationale: >
          Current bundles can spend much of a small budget on required large
          enclosing scopes, reducing the precision of context for real tasks.
        work:
          - Identify bundle cases where target or enclosing context dominates the budget.
          - Define compact fallback behavior for large required scopes.
          - Preserve provenance and uncertainty notes for any abbreviated context.
          - Add fixture and real-repo validation for small-budget bundles.
        acceptance:
          - Prevents large enclosing scopes from dominating small budgets and verifies budget behavior through fixtures and real-repo cases.

      - id: V1-005
        title: Reduce C++ vendor diagnostics and unresolved-reference noise
        status: todo
        priority: P1
        type: AFK
        blocked_by: [V1-003]
        rationale: >
          Real C++ validation showed high parser diagnostic and unresolved
          reference counts, especially from third-party code, which weakens
          context bundle precision.
        work:
          - Use improved ignore semantics to reduce third-party diagnostic noise.
          - Review C++ unresolved-reference patterns from real validation cases.
          - Improve ranking or presentation so noisy global diagnostics do not dominate local failure-mode context.
          - Add regression cases for the observed C++ validation failures.
        acceptance:
          - Reduces noisy C++ parser diagnostics and improves usefulness of C++ bundles, especially failure-mode bundles affected by vendored code.

      - id: V1-006
        title: Pin and verify runtime dependency compatibility
        status: todo
        priority: P1
        type: AFK
        blocked_by: [V1-001]
        rationale: >
          1.0 should not depend on unbounded runtime parser packages whose API
          or grammar behavior can change underneath users.
        work:
          - Bound runtime dependencies in packaging metadata.
          - Verify supported Python versions and tree-sitter package combinations in CI.
          - Document the supported dependency and platform matrix.
          - Add an upgrade checklist for future dependency bumps.
        acceptance:
          - Pins or bounds runtime dependencies and verifies supported Python/tree-sitter combinations in CI.

      - id: V1-007
        title: Establish real-repo performance and storage gates
        status: todo
        priority: P1
        type: AFK
        blocked_by: [V1-002]
        rationale: >
          Synthetic performance smoke tests are useful, but 1.0 readiness needs
          real-repo indexing, query, and database-size expectations.
        work:
          - Define representative real-repo performance scenarios.
          - Measure index time, query time, context time, and database size ratio.
          - Add an opt-in or scheduled performance gate with documented thresholds.
          - Record baseline results and expected variance.
        acceptance:
          - Defines real-repo index/query/storage thresholds and adds an opt-in or scheduled performance gate.

      - id: V1-008
        title: Stabilize release automation and artifact publishing
        status: todo
        priority: P1
        type: AFK
        blocked_by: [V1-001]
        rationale: >
          1.0 releases should have repeatable tagged builds and published
          artifacts, including a versioned PEX asset on GitHub Releases.
        work:
          - Ensure tag-triggered release builds create or update GitHub Releases.
          - Publish versioned PEX assets and workflow build artifacts.
          - Document manual dispatch and recovery for existing tags.
          - Verify release CI on a non-production test tag before 1.0.
        acceptance:
          - Ensures tagged releases create or update GitHub Releases with versioned PEX assets and documented manual recovery steps.

      - id: V1-009
        title: Harden Unicode, encoding, and binary-file handling
        status: todo
        priority: P2
        type: AFK
        blocked_by: [V1-002]
        rationale: >
          Source span and snippet behavior must remain correct for real-world
          files with multibyte text, BOMs, invalid encodings, or binary-like
          content.
        work:
          - Add tests for invalid UTF-8 and non-UTF-8 text files.
          - Add tests for BOM handling and multibyte line boundaries.
          - Decide how unsupported encodings and binary-like files are reported.
          - Ensure indexing failures remain actionable diagnostics rather than crashes.
        acceptance:
          - Adds coverage for invalid UTF-8, BOMs, non-UTF-8 text, multibyte boundaries, and binary-ish source files.

      - id: V1-010
        title: Simplify context planner internals without behavior drift
        status: todo
        priority: P2
        type: AFK
        blocked_by: [V1-002, V1-004]
        rationale: >
          The context planner is the largest concentration of ranking, SQL,
          candidate generation, and budget behavior; improving locality will
          make 1.0 maintenance safer.
        work:
          - Identify planner responsibilities that can be separated behind stable internal interfaces.
          - Refactor in small slices while preserving golden output.
          - Keep behavior changes gated by the real-repo evaluation harness.
          - Document any intentional ranking or output differences.
        acceptance:
          - Refactors context/planner.py for locality while keeping golden and real-repo evaluation output stable.

      - id: V1-011
        title: Document 1.0 user guarantees and known limitations
        status: todo
        priority: P2
        type: AFK
        blocked_by: [V1-001, V1-002, V1-006]
        rationale: >
          Users need clear 1.0 documentation for what is stable, what remains
          heuristic, what platforms are supported, and how future migrations
          will be handled.
        work:
          - Update README and release-readiness docs with 1.0 guarantees.
          - Document supported platforms, Python versions, and artifact types.
          - Document known Java and C++ heuristic limitations.
          - Document migration expectations for future schema or output changes.
        acceptance:
          - Updates README/docs to clearly state 1.0 guarantees, caveats, supported platforms, and migration expectations.

      - id: V1-012
        title: Decide whether incremental indexing belongs before 1.0
        status: todo
        priority: P3
        type: HITL
        blocked_by: [V1-007]
        rationale: >
          Incremental indexing may improve repeated real-repo workflows, but it
          also adds complexity and compatibility surface that may not be needed
          for 1.0.
        work:
          - Use real-repo performance evidence to decide whether full reindexing is acceptable for 1.0.
          - If needed, define the minimum incremental indexing behavior for 1.0.
          - If deferred, record the rationale and expected future trigger.
          - Update release criteria and documentation with the decision.
        acceptance:
          - Records a decision on incremental indexing before 1.0, either implementing a minimal version or explicitly deferring it.
priority_order:
