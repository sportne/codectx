name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Release tag must look like vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          release_version="${RELEASE_TAG#v}"
          package_version="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          module_version="$(python - <<'PY'
          import ast
          from pathlib import Path

          module = ast.parse(Path("src/codectx/__init__.py").read_text(encoding="utf-8"))
          for node in module.body:
              if (
                  isinstance(node, ast.Assign)
                  and len(node.targets) == 1
                  and isinstance(node.targets[0], ast.Name)
                  and node.targets[0].id == "__version__"
                  and isinstance(node.value, ast.Constant)
              ):
                  print(node.value.value)
                  break
          else:
              raise SystemExit("__version__ not found")
          PY
          )"
          if [ "$package_version" != "$release_version" ]; then
            echo "pyproject version $package_version does not match $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$module_version" != "$release_version" ]; then
            echo "module version $module_version does not match $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Create virtual environment
        run: make setup-venv VENV=.venv

      - name: Install development dependencies
        run: make install-dev VENV=.venv

      - name: Run release CI
        run: |
          set -euo pipefail
          artifact="dist/codectx-${RELEASE_VERSION}.pex"
          if make -n release-ci VENV=.venv ARTIFACT="$artifact" >/dev/null 2>&1; then
            make release-ci VENV=.venv ARTIFACT="$artifact"
          else
            make ci VENV=.venv
            make package VENV=.venv
            make artifact-smoke VENV=.venv ARTIFACT="$artifact"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codectx-${{ env.RELEASE_VERSION }}-release-artifacts
          path: |
            dist/codectx-${{ env.RELEASE_VERSION }}.pex
            dist/codectx-${{ env.RELEASE_VERSION }}.tar.gz
            dist/codectx-${{ env.RELEASE_VERSION }}-py3-none-any.whl
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pex_asset="dist/codectx-${RELEASE_VERSION}.pex"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$pex_asset" --clobber
          else
            gh release create "$RELEASE_TAG" "$pex_asset" \
              --title "codectx ${RELEASE_VERSION}" \
              --notes "Release ${RELEASE_VERSION}. The attached PEX is a local, runnable codectx artifact for supported Linux and Windows CPython targets."
          fi
