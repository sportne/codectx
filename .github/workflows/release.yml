name: Release

on:
  push:
    tags:
      - "v*"
      - "release-smoke/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0 or release-smoke/v0.1.0-smoke-YYYYMMDDHHMM"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version
        run: |
          set -euo pipefail
          python scripts/validate_release_tag.py "$RELEASE_TAG" --github-env "$GITHUB_ENV"

      - name: Create virtual environment
        run: make setup-venv VENV=.venv

      - name: Install development dependencies
        run: make install-dev VENV=.venv

      - name: Run release CI
        run: |
          set -euo pipefail
          artifact="dist/codectx-${ASSET_VERSION}.pex"
          if make -n release-ci VENV=.venv ARTIFACT="$artifact" >/dev/null 2>&1; then
            make release-ci VENV=.venv ARTIFACT="$artifact"
          else
            make ci VENV=.venv
            make package VENV=.venv
            make artifact-smoke VENV=.venv ARTIFACT="$artifact"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codectx-${{ env.ASSET_VERSION }}-release-artifacts
          path: |
            dist/codectx-${{ env.ASSET_VERSION }}.pex
            dist/codectx-${{ env.PACKAGE_VERSION }}.tar.gz
            dist/codectx-${{ env.PACKAGE_VERSION }}-py3-none-any.whl
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pex_asset="dist/codectx-${ASSET_VERSION}.pex"
          sdist_asset="dist/codectx-${PACKAGE_VERSION}.tar.gz"
          wheel_asset="dist/codectx-${PACKAGE_VERSION}-py3-none-any.whl"
          edit_flags=(--title "$RELEASE_TITLE" --notes "$RELEASE_NOTES")
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            edit_flags+=(--prerelease --latest=false)
          else
            edit_flags+=(--latest)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${edit_flags[@]}"
            gh release upload "$RELEASE_TAG" "$pex_asset" "$sdist_asset" "$wheel_asset" --clobber
          else
            gh release create "$RELEASE_TAG" "$pex_asset" "$sdist_asset" "$wheel_asset" \
              "${edit_flags[@]}"
          fi
